<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Auto Group Tabs – Settings</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 24px; }
    .row { display: grid; grid-template-columns: 1fr 140px 320px 80px; gap: 8px; align-items: center; margin-bottom: 6px; }
    .row input[type="text"] { width: 100%; }
    .hdr { font-weight: 600; }
    .btn { padding: 6px 10px; }
    .muted { color: #666; font-size: 12px; }
    #rules { margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Auto Group Tabs – Settings</h2>

  <label>
    <input id="groupByBaseDomain" type="checkbox" />
    Group other sites by base domain
  </label>
  <div style="margin:8px 0">
    Default color:
    <select id="defaultColor"></select>
  </div>

  <div class="hdr row" style="margin-top:16px;">
    <div>Group Title</div><div>Color</div><div>Host patterns (comma-separated or /regex/)</div><div></div>
  </div>
  <div id="rules"></div>

  <div style="margin-top:12px;">
    <button id="add" class="btn">Add rule</button>
    <button id="save" class="btn">Save</button>
    <button id="reapply" class="btn">Reapply grouping</button>
    <button id="reset" class="btn">Reset to defaults</button>
  </div>

  <div style="margin-top:12px;">
    <button id="export" class="btn">Export JSON</button>
    <input id="importFile" type="file" accept="application/json" />
    <button id="importBtn" class="btn">Import</button>
  </div>

  <p class="muted">Colors: grey, blue, red, yellow, green, pink, purple, cyan, orange.</p>

  <script src="options.js"></script>
</body>
</html>
